# ─── Server ───────────────────────────────────────────────────────────────────
# Reads PORT from deployment environment (Render, Railway, etc.) with local 8080 fallback
server.port=${PORT:8080}

# ─── Application name ─────────────────────────────────────────────────────────
spring.application.name=cynbit-blueprint-studio-api

# ─── JSON serialisation ───────────────────────────────────────────────────────
# Write dates as ISO-8601 strings, not timestamp arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── CORS Configuration ──────────────────────────────────────────────────────
# Configurable via APP_CORS_ALLOWED_ORIGINS environment variable or property
# Defaults to local Vite dev server (5173) and local port 3000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.in.cynbit=INFO
logging.level.org.springframework.web=INFO
