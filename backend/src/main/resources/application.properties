# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application name ─────────────────────────────────────────────────────────
spring.application.name=cynbit-blueprint-studio-api

# ─── JSON serialisation ───────────────────────────────────────────────────────
# Write dates as ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── CORS (override at deploy time via env var) ───────────────────────────────
# Default allows local Vite dev server + local port 3000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.in.cynbit=DEBUG
logging.level.org.springframework.web=INFO

